name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate manifests, plists and repository contents
        run: python tests/validate.py
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Message) in $($_.Extent.File)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Verify pinned upstream archives
        shell: pwsh
        run: ./scripts/Get-Dependencies.ps1
      - name: Parse guest shell scripts
        shell: bash
        run: bash -n guest/*.sh

  patched-driver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout MacHyperVSupport 0.9.9
        run: git clone --depth=1 --branch 0.9.9 https://github.com/acidanthera/MacHyperVSupport.git build/MacHyperVSupport
      - name: Apply Tahoe patches
        run: git -C build/MacHyperVSupport apply "$GITHUB_WORKSPACE/patches/machyperv-tahoe.patch"
      - uses: actions/checkout@v7
        with:
          repository: acidanthera/MacKernelSDK
          path: build/MacHyperVSupport/MacKernelSDK
      - name: Bootstrap Lilu
        working-directory: build/MacHyperVSupport
        run: |
          export BUILD_MODE=prebuilt
          export TRAVIS_TAG=local
          export GITHUB_REF=''
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh)
          eval "$src"
      - name: Compile patched Tahoe kexts
        working-directory: build/MacHyperVSupport
        run: |
          xcodebuild -project MacHyperVSupport.xcodeproj -target MacHyperVSupportMonterey -configuration Release ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO clean build
          xcodebuild -project MacHyperVSupport.xcodeproj -target MacHyperVFramebuffer -configuration Release ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/Release/MacHyperVSupportMonterey.kext patched-MacHyperVSupportMonterey.zip
          ditto -c -k --keepParent build/Release/MacHyperVFramebuffer.kext patched-MacHyperVFramebuffer.zip
      - uses: actions/upload-artifact@v7
        with:
          name: tahoe-hyperv-kexts
          path: build/MacHyperVSupport/patched-*.zip

  audio-bridge:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate audio metadata and shell installers
        run: |
          plutil -lint audio/macos/Info.plist
          plutil -lint audio/macos/com.dossijeo.hypervaudiobridge.plist.in
          bash -n audio/macos/install.sh audio/macos/uninstall.sh
      - name: Compile CoreAudio UDP bridge
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror \
            audio/macos/hyperv-audio-bridge.c \
            -framework AudioToolbox -framework CoreFoundation \
            -o "$RUNNER_TEMP/HyperVAudioBridge"
          test -x "$RUNNER_TEMP/HyperVAudioBridge"
      - name: Verify official BlackHole package checksum
        run: |
          curl -LfsS \
            https://existential.audio/downloads/BlackHole2ch-0.7.1.pkg \
            -o "$RUNNER_TEMP/BlackHole2ch-0.7.1.pkg"
          echo "57b540f27a3e29c37e310e01bee0fdfab76733087e47f997ef9dccf851400dcf  $RUNNER_TEMP/BlackHole2ch-0.7.1.pkg" \
            | shasum -a 256 -c -
          pkgutil --check-signature "$RUNNER_TEMP/BlackHole2ch-0.7.1.pkg"

  compose-uikit-cpu-raster:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout pinned Compose Multiplatform Core
        run: |
          source guest/raster-versions.env
          git clone --filter=blob:none https://github.com/JetBrains/compose-multiplatform-core.git build/compose
          git -C build/compose fetch --depth=1 origin "$COMPOSE_COMMIT"
          git -C build/compose checkout --detach "$COMPOSE_COMMIT"
          git clone --filter=blob:none https://github.com/JetBrains/skiko.git build/skiko
          git -C build/skiko fetch --depth=1 origin "$SKIKO_COMMIT"
          git -C build/skiko checkout --detach "$SKIKO_COMMIT"
      - name: Apply and compile UIKit CPU-raster Skiko
        run: |
          source guest/raster-versions.env
          for patch in \
            patches/skiko-uikit-cpu-raster.patch \
            patches/skiko-uikit-cpu-raster-software-redrawer.patch \
            patches/skiko-uikit-cpu-raster-build-helper.patch
          do
            git -C build/skiko apply --check "$GITHUB_WORKSPACE/$patch"
            git -C build/skiko apply "$GITHUB_WORKSPACE/$patch"
          done
          raster_repo="$HOME/.local/share/macos-hyperv-builder/raster-m2/repository"
          deploy_version="${SKIKO_RASTER_VERSION%-SNAPSHOT}"
          (
            cd build/skiko/skiko
            ./gradlew \
              publishIosX64PublicationToMavenLocal \
              publishKotlinMultiplatformPublicationToMavenLocal \
              -Pdeploy.version="$deploy_version" \
              -Pskiko.awt.enabled=false \
              -Pskiko.js.enabled=false \
              -Pskiko.wasm.enabled=false \
              -Pskiko.android.enabled=false \
              -Pskiko.native.enabled=false \
              -Pskiko.native.linux.enabled=false \
              -Pskiko.native.mac.enabled=false \
              -Pskiko.native.ios.enabled=false \
              -Pskiko.native.ios.arm64.enabled=false \
              -Pskiko.native.ios.simulatorArm64.enabled=false \
              -Pskiko.native.ios.x64.enabled=true \
              --console=plain
          )
          # GitHub's Gradle/Maven environment ignores maven.repo.local for
          # PublishToMavenLocal. Copy only the two required publications from
          # the standard local repository into the isolated raster repository.
          for artifact in skiko skiko-iosx64
          do
            source_dir="$HOME/.m2/repository/org/jetbrains/skiko/$artifact/$SKIKO_RASTER_VERSION"
            target_dir="$raster_repo/org/jetbrains/skiko/$artifact/$SKIKO_RASTER_VERSION"
            test -d "$source_dir"
            mkdir -p "$target_dir"
            cp -R "$source_dir/." "$target_dir/"
          done
      - name: Apply UIKit CPU-raster patch
        run: |
          git -C build/compose apply --check \
            "$GITHUB_WORKSPACE/patches/compose-1.10.0-uikit-cpu-raster.patch"
          git -C build/compose apply \
            "$GITHUB_WORKSPACE/patches/compose-1.10.0-uikit-cpu-raster.patch"
      - name: Compile patched iOS x64 Compose UI
        working-directory: build/compose
        run: |
          source "$GITHUB_WORKSPACE/guest/raster-versions.env"
          raster_repo="$HOME/.local/share/macos-hyperv-builder/raster-m2/repository"
          skiko_dir="$raster_repo/org/jetbrains/skiko/skiko/$SKIKO_RASTER_VERSION"
          test -f "$skiko_dir/skiko-$SKIKO_RASTER_VERSION.module"
          test -f "$skiko_dir/skiko-$SKIKO_RASTER_VERSION.pom"
          mkdir -p "$RUNNER_TEMP/android-sdk-placeholder"
          ANDROIDX_PROJECTS=KMP \
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk-placeholder" \
          HYPERV_RASTER_REPOSITORY="$raster_repo" \
          SKIKO_VERSION="$SKIKO_RASTER_VERSION" \
          ./gradlew \
            --init-script "$GITHUB_WORKSPACE/guest/hyperv-compose-raster.init.gradle" \
            :compose:ui:ui:compileKotlinUikitX64 \
            --console=plain
